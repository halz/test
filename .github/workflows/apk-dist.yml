name: APK dist

# Manually triggered: builds the debug APK and force-pushes it to the
# `apk-dist` branch so it can be fetched over plain git transport
# (environments where Actions artifact downloads are unavailable).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Push APK to apk-dist branch
        run: |
          mkdir /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/
          cd /tmp/dist
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git commit -m "app-debug.apk built from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
