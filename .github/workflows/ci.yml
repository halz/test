name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rfb-test:
    name: RFB protocol tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless VNC test servers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends x11vnc xvfb x11-xserver-utils xdotool
      - name: Run :rfb tests (unit + live x11vnc integration)
        # ANDROID_HOME is unset so settings.gradle.kts skips :app here,
        # mirroring the SDK-less container this repo is developed in.
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :rfb:test --console=plain

  app-build:
    name: Android app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
