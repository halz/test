name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rfb-test:
    name: RFB protocol tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless VNC test servers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends x11vnc xvfb x11-xserver-utils xdotool
      - name: Run :rfb tests (unit + live x11vnc integration)
        # ANDROID_HOME is unset so settings.gradle.kts skips :app here,
        # mirroring the SDK-less container this repo is developed in.
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :rfb:test --console=plain

  app-build:
    name: Android app build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The RDP (FreeRDP + OpenSSL) native libraries take ~15 min to build, so
      # they are rebuilt only when the build script (and its pinned revision)
      # changes.
      - name: Restore FreeRDP native libraries
        id: freerdp-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: freerdp-android-${{ hashFiles('tools/build-freerdp-android.sh') }}
      - name: Build FreeRDP native libraries
        if: steps.freerdp-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build pkg-config
          tools/build-freerdp-android.sh
      # FreeRDP and OpenSSL ship with symbols (~50 MB); stripping is
      # idempotent, so it also applies to libraries restored from the cache.
      - name: Strip native libraries
        run: |
          STRIP="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find app/src/main/jniLibs -name '*.so' -exec "$STRIP" --strip-unneeded {} +
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Also publish the APK to the `apk-dist` branch so it can be fetched
      # over plain git transport (Actions artifact downloads require auth).
      - name: Push APK to apk-dist branch
        if: github.event_name == 'push'
        run: |
          mkdir /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/
          cd /tmp/dist
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git commit -m "app-debug.apk built from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-build:
    name: Windows desktop app (EXE)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run :desktop tests
        run: ./gradlew :desktop:test --console=plain
      # Portable build: a folder with MacRemote.exe and a bundled Java runtime.
      - name: Build portable app
        run: ./gradlew :desktop:createDistributable --console=plain
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/MacRemote -DestinationPath MacRemote-portable.zip
      # jpackage builds the installer with WiX 3; install it if the image lacks it.
      - name: Ensure WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" | ForEach-Object { "$($_.FullName)\bin" >> $env:GITHUB_PATH }
          }
      - name: Build installer
        run: |
          ./gradlew :desktop:packageExe --console=plain
          cp desktop/build/compose/binaries/main/exe/MacRemote-*.exe MacRemote-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            MacRemote-portable.zip
            MacRemote-setup.exe
      # Also publish to the `exe-dist` branch so the files can be fetched over
      # plain git transport (Actions artifact downloads require auth).
      - name: Push to exe-dist branch
        if: github.event_name == 'push'
        run: |
          ls -l MacRemote-portable.zip MacRemote-setup.exe
          mkdir "$RUNNER_TEMP/dist"
          cp MacRemote-portable.zip MacRemote-setup.exe "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          git init -b exe-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MacRemote-portable.zip MacRemote-setup.exe
          git commit -m "Windows build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" exe-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
